<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#12151b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
.pad{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;display:none;align-items:center;justify-content:center;
  font:600 30px Oswald,sans-serif;color:#d6a54e;background:rgba(42,48,59,.55);border:1px solid rgba(214,165,78,.45);touch-action:none}
.pad.on{background:rgba(214,165,78,.35);color:#ffe3a0}
body.touch .pad{display:flex}
#padL{left:max(18px,env(safe-area-inset-left))}
#padR{right:max(18px,env(safe-area-inset-right))}
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" aria-label="Catbot: walk left and right"></canvas></div>
<div class="pad" id="padL" role="button" aria-label="walk left">◀</div>
<div class="pad" id="padR" role="button" aria-label="walk right">▶</div>
<script src="catbot.js"></script>
<script>
'use strict';
/* =====================================================================
   CATBOT · room 1.  Jamference AI Game Jam Hack 1 (theme: cat + robot).
   Built with Claude Opus 5.5 (claude-opus-5-5) in Claude Code.
   Jam rule: every input is movement. ← → / A D / the two touch pads.
   Title, restart and room transitions all happen by walking somewhere.
   Layers: room data -> world (props, constraints) -> ctrl -> rig (catbot.js)
   ===================================================================== */
const W=720, H=405;
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
const catC=document.createElement('canvas'), cctx=catC.getContext('2d');
const silC=document.createElement('canvas'), sctx=silC.getContext('2d');
const FILTER=typeof ctx.filter==='string';
let S=1;

/* =====================================================================
   ROOMS: plain data. A new room is a new object, not new code.
   x values are world px (left edges unless noted); GY is the deck line.
   ===================================================================== */
const ROOMS=[{
  id:'aft-hold', name:'Aft hold', w:1460,
  floorSlip:0,                              // 0 = deck plate, →1 = ice (feet slide, slow to start/stop)
  start:{x:250, face:1},
  reset:{x:22, w:112},                      // walk onto it: the room rewinds
  crate:{x:420, w:96, h:80, mass:1},        // mass 1 = needs full strain to break static friction
  plate:{x:640, w:100, depth:78},           // recess x..x+w, plate at the bottom; its far wall is the stopper
  gate:{x:860, w:22},                       // held open while the crate sits on the plate
  part:{x:1040, id:'hip'},                  // what catbot thinks is a toy
  exit:{x:1180},                            // hatch in the end bulkhead; opens once the part is in
  port:{x:190},                             // porthole (light source, matches the shadow direction)
  captions:[
    {on:'start', text:'← →  or  A D.   Walking is the only verb.'},
    {on:'push',  text:'Heavy things move if you lean on them long enough.'}
  ]
}];

/* =====================================================================
   STATE
   ===================================================================== */
const rig=new Catbot();
const CAT={weight:1, nose:88, paw:62};      // nose: root→face of whatever it leans on; paw: root→ledge edge
const keys={l:false,r:false};
const dirInput=()=>(keys.r?1:0)-(keys.l?1:0);
let room, roomI=0, st, camX=0, mode='play', modeT=0, fade=1, fadeDir=-1, fadeCb=null;
let idle=0, walkT=0, walkDir=0, look=0, lookT=0, latch=false;   // latch: ignore a key still held from before a fade
const installed=new Set();                    // installed parts survive a rewind
const seenCaps=new Set(), caps=[];
const P={on:false,dir:0,pt:0,str:0,F:0,cd:0,nx:0};

function loadRoom(i){room=ROOMS[i];roomI=i;resetRoom();camX=camTarget();}
function resetRoom(){
  const R=room;
  st={
    crate:{x:R.crate.x,w:R.crate.w,h:R.crate.h,mass:R.crate.mass??1,v:0,cy:0,vy:0,rot:0,st:'floor',x0:0,ft:0},
    gate:new Spring(0,1.4,.38), door:new Spring(0,1.8,.5),
    plate:0, cable:0, got:installed.has(R.part?.id), oops:null, pk:{}
  };
  for(const k of [...flags])if(/^(perk|jump|test|puff)/.test(k))flags.delete(k);
  Object.assign(P,{on:false,str:0,F:0});
  rig.reset(R.start.x);if(R.start.face<0)rig.flip();
  rig.hipGear=installed.has('hip')?1:0;
  idle=0;walkT=0;
}
function caption(on){
  if(seenCaps.has(on))return;seenCaps.add(on);
  for(const c of room.captions||[])if(c.on===on)caps.push({text:c.text,t:0,max:c.dur||4.2});
}
function fadeTo(cb){if(fadeDir>0)return;fadeDir=1;fadeCb=()=>{cb();latch=true;};}

/* =====================================================================
   WORLD: crate, recess + plate, gate, hatch, part
   ===================================================================== */
const pit=()=>room.plate;
const pitOpen=()=>room.plate&&st.crate.st!=='set';
function crateBlocks(){const cr=st.crate;return cr.st!=='set'||cr.h-2-cr.cy>4;}

function updCrate(dt){
  const cr=st.crate,pl=pit();
  if(cr.st==='floor'&&pl){
    // stopper: the recess walls stop a crate that is sliding over it
    if(cr.x+cr.w>pl.x&&cr.x<pl.x+pl.w){
      if(cr.x+cr.w>pl.x+pl.w){cr.x=pl.x+pl.w-cr.w;cr.v=0;}
      if(cr.x<pl.x&&cr.x+cr.w/2>pl.x+pl.w)cr.x=pl.x;
    }
    // once its centre is over the hole there is nothing holding it up
    const mid=cr.x+cr.w/2;
    if(mid>pl.x+2&&mid<pl.x+pl.w-2){
      cr.st='fall';cr.vy=0;cr.x0=cr.x;cr.ft=0;cr.dir=mid<pl.x+pl.w/2?1:-1;cr.v=0;
      if(P.on){endPush();st.oops=0;rig.thv-=1.3;rig.hOx.vel+=70;rig.hOy.vel-=40;rig.vy-=60;rig.tailFlick(3);}
    }
  }
  if(cr.st==='fall'){
    cr.ft+=dt;cr.vy+=G*dt;cr.cy+=cr.vy*dt;
    const tx=pl.x+(pl.w-cr.w)/2;cr.x=lerp(cr.x0,tx,smooth(cr.cy/pl.depth));
    cr.rot=Math.sin(Math.PI*clamp(cr.cy/pl.depth,0,1))*.13*cr.dir;
    if(cr.cy>=pl.depth){
      cr.cy=pl.depth;cr.rot=0;cr.st='set';
      const p=clamp(cr.vy/700,.6,1.4);
      shake=Math.max(shake,6*p);
      FX.dust(pl.x-6,GY,8,p,-1);FX.dust(pl.x+pl.w+6,GY,8,p,1);FX.ring(pl.x+pl.w/2,GY,p);
      FX.flash(pl.x+pl.w/2,GY+pl.depth-4,.8,'255,220,150');
      rig.earL.vel-=14;rig.earR.vel-=12;rig.hOy.vel-=30;
    }
  }
  if(cr.st==='set'){
    st.plate=damp(st.plate,1,10,dt);
    st.cable=Math.min(1,st.cable+dt*1.6);
  }
}
function updGates(dt){
  const g=room.gate,ex=room.exit;
  if(g){
    const under=Math.abs(rig.x-(g.x+g.w/2))<70;
    const want=st.cable>=1?1:(under&&st.gate.v>.3?st.gate.v:0);
    const was=st.gate.v;st.gate.step(want,dt);st.gate.v=clamp(st.gate.v,0,1.06);
    if(was<.02&&st.gate.v>=.02)FX.dust(g.x+g.w/2,GY,5,.5);
  }
  if(ex){
    const ready=!room.part||st.got, near=rig.x>ex.x-300;
    const was=st.door.v;st.door.step(ready&&near?1:0,dt);st.door.v=clamp(st.door.v,0,1.06);
    if(was<.02&&st.door.v>=.02)FX.steam(ex.x+20,GY-150,4,.7);
  }
}
/* solid x-intervals at catbot's height. clr = root distance it can get to the face */
function blockers(){
  const b=[{x0:-1e4,x1:16,clr:CAT.nose}], cr=st.crate, R=room;
  if(crateBlocks())b.push({x0:cr.x,x1:cr.x+cr.w,clr:CAT.nose});
  if(pitOpen()){const pl=pit();b.push({x0:pl.x,x1:pl.x+pl.w,clr:CAT.paw});}
  if(R.gate&&st.gate.v<.8)b.push({x0:R.gate.x,x1:R.gate.x+R.gate.w,clr:CAT.nose});
  if(R.exit&&st.door.v<.8)b.push({x0:R.exit.x+10,x1:R.exit.x+30,clr:CAT.nose});
  return b;
}
let BL=[];
function constrain(){
  for(const b of BL){
    if(b.x0>rig.x){const lim=b.x0-b.clr;if(rig.x>lim){rig.x=lim;if(rig.vx>0)rig.vx=0;}}
    else if(b.x1<rig.x){const lim=b.x1+b.clr;if(rig.x<lim){rig.x=lim;if(rig.vx<0)rig.vx=0;}}
  }
}

/* =====================================================================
   PUSH: lifted from the rig's push study. Force = strain × leg
   compression × catbot's weight; stick-slip against the crate's mass.
   ===================================================================== */
function contactX(dir){const cr=st.crate;return dir>0?cr.x-CAT.nose:cr.x+cr.w+CAT.nose;}
function endPush(){P.on=false;P.str=0;P.F=0;}
function push(dt,c,dir){
  const cr=st.crate;
  if(!P.on){
    const ok=dir&&cr.st==='floor'&&rig.facing===dir&&rig.turnT<0&&!rig.air&&Math.abs(rig.x-contactX(dir))<2.5;
    if(!ok)return false;
    Object.assign(P,{on:true,dir,pt:0,str:0,F:0,cd:0});caption('push');
  }
  if(dir!==P.dir||cr.st!=='floor'){endPush();return false;}
  P.pt+=dt;
  const s=seg(P.pt,0,.5), k=s*(.55+.45*P.str), slip=room.floorSlip;
  Object.assign(c,{crouch:.42*k,pitch:-.15*k,headDrop:14*k,headPitch:-.32*k,headFwd:0,earL:40*k,earR:36*k,lid:.3+.15*P.str,lidTilt:.6+.4*P.str,pupil:.3,mouth:-.7*P.str,lookX:.6,lookY:-.2,
    tailBase:lerp(162,176,s),tailCurve:lerp(-9,-2.5,s),tailTip:-6,tailStiff:1.4,wagAmp:1,hindReach:-16*s,gaitRate:0,earFlick:false,weight:CAT.weight,slip});
  const face=dir>0?cr.x-2:cr.x+cr.w+2;
  c.manual.FN={x:face,y:24,ang:1.45,rate:9};c.manual.FF={x:face,y:31,ang:1.45,rate:8};
  const hn=rig.leg('HN'),hf=rig.leg('HF');
  const ext=-(rig.footErr(hn)+rig.footErr(hf))/2, stuck=cr.v<=0, both=hn.planted&&hf.planted;
  const force=()=>CAT.weight*(.5+.72*P.str)*clamp(1.12-Math.max(0,ext)/38,0,1.12);
  const muS=cr.mass, muK=cr.mass*.74*(1-.8*slip);
  P.cd-=dt;
  if(stuck&&P.pt>.45){
    if(ext>12&&both&&P.cd<=0){rig.forceStep(P.nx?'HF':'HN',.2);P.nx^=1;P.cd=.26;P.str*=.6;}
    else if(both)P.str=Math.min(1,P.str+dt*1.15);
    P.F=force();
    if(P.F>muS){cr.v=6;FX.dust(cr.x+4,GY,5,.7,-1);FX.dust(cr.x+cr.w-4,GY,5,.7,1);shake=Math.max(shake,2.2);}
    if(P.str>.75&&Math.random()<dt*5){const kp=rig.toWorld(rig.keyP);FX.steam(kp.x,kp.y-4,1,.8);}
  }else if(!stuck){
    P.F=force();
    cr.v=Math.max(0,cr.v+(P.F-muK)*340/cr.mass*dt);
    if(cr.v===0)P.str=.2;
    if(Math.random()<dt*14)FX.dust(cr.x+rnd(0,cr.w),GY,1,.5,-dir);
    if(Math.random()<dt*20)scratch(dir>0?cr.x+rnd(2,20):cr.x+cr.w-rnd(2,20)-14,rnd(8,18),.35);
  }
  cr.x+=dir*cr.v*dt;
  c.kin=dir*cr.v+(contactX(dir)-rig.x)*10;
  c.strain=stuck?(P.pt>.45?P.str:0):.35;
  return true;
}

/* =====================================================================
   CONTROL: input -> ctrl, per mode
   asleep -> wake -> play <-> (pounce | oops) -> exit -> card -> asleep
   ===================================================================== */
function walk(dt,c,dir){
  const slip=room.floorSlip;
  c.slip=slip;c.accel=260*(1-.8*slip);c.weight=CAT.weight;c.limp=rig.hipGear<1?1:0;
  if(push(dt,c,dir))return;
  if(dir){
    idle=0;
    if(dir===walkDir&&Math.abs(rig.vx)>40)walkT+=dt;else if(dir!==walkDir)walkT=0;
    walkDir=dir;
    // hold it and it breaks into a trot. not on a bad hip, though.
    const max=c.limp?92:walkT>1.6?165:105;
    c.face=dir;c.vx=(dir===rig.facing&&rig.turnT<0)?dir*max:0;
    if(max>140){c.earL=c.earR=16;c.tailBase=172;c.tailCurve=-5;}
  }else{idle+=dt;walkT=0;walkDir=0;}
  if(Math.abs(rig.vx)<8&&!dir){
    lookT-=dt;if(lookT<0){lookT=rnd(.9,2.4);look=rnd(-1,1);}
    c.lookX=look;c.headYaw=.35+look*.22;c.wagAmp=7;c.wagFreq=.6;
  }
}
/* wound down: the end pose of the rig's wind-down study, held */
function slump(c,t){
  Object.assign(c,{energy:.05+.04*Math.sin(t*2),lid:.85,lidTilt:-.6,colF:1,colH:1,headDrop:34,headPitch:-.5,earL:58,earR:52,
    tailStiff:.08,tailBase:205,tailCurve:4,tailTip:0,height:.84,bodyFreq:1.8,lookY:-.6,pupil:.7,wagAmp:0,earFlick:false,blink:false,keySpin:0,mouth:-.6,lift:.22,limp:1});
  const f=rig.facing,sx=rig.x+f*(rig.shJ.x+38),hx=rig.x+f*(rig.hipJ.x+17);
  c.manual.FN={x:sx,y:0,rate:10};c.manual.FF={x:sx-6*f,y:0,rate:9};
  c.manual.HN={x:hx,y:0,rate:8};c.manual.HF={x:hx-5*f,y:0,rate:8};
}
function sleep(){
  mode='asleep';modeT=0;
  for(let t=0;t<2.6;t+=SUB){const c=freshCtrl();slump(c,t);rig.update(SUB,c);}   // pre-roll the collapse off-screen
  rig.events.length=0;parts.length=0;scratches.length=0;shake=0;camX=camTarget();
}
/* first step: the rewind. Same beats as the rig study, re-timed from the keypress */
function wake(dt,c,t){
  const E=seg(t,.4,1.2), f=rig.facing;
  Object.assign(c,{energy:t<1.2?E*(.4+Math.random()*.6):1,height:lerp(.84,1,E),headPitch:-(1-E)*.5,earL:(1-E)*58,earR:(1-E)*52,tailStiff:.08+.92*E,
    tailBase:lerp(205,162,E),tailCurve:lerp(4,-9,E),tailTip:lerp(0,-16,E),lid:t<1.2?lerp(.85,.5,t/1.2):0,lidTilt:lerp(-.6,.35,E),
    bodyFreq:lerp(1.8,3.2,E),pupil:t<1.2?.7:.25,lookY:-(1-E)*.6,wagAmp:3*E,earFlick:false,mouth:-(1-E)*.6,blink:false,limp:1});
  c.keySpin=t<1.2?-24:2;
  const cf=1-seg(t,1.8,2.2), ch=1-seg(t,1.4,1.8);
  c.colF=cf;c.colH=ch;c.headDrop=lerp(15,34,cf)*(1-seg(t,1.2,1.6));
  if(cf>.02&&t<1.95){const sx=rig.x+f*(rig.shJ.x+38);c.manual.FN={x:sx,y:0,rate:10};c.manual.FF={x:sx-6*f,y:0,rate:9};}
  if(ch>.02&&t<1.6){const hx=rig.x+f*(rig.hipJ.x+17);c.manual.HN={x:hx,y:0,rate:8};c.manual.HF={x:hx-5*f,y:0,rate:8};}
  if(t>1.2&&t<2.5){c.earL=-14;c.earR=-12;}
  if(t<1.2&&(st.tick=(st.tick||0)+dt)>.075){st.tick=0;const k=rig.toWorld(rig.keyP);FX.sparks(k.x,k.y,1,f*(Math.random()<.5?1:-1),.5);}
  if(once('relit',t>=1.2)){const p=rig.toWorld(rig.bp(60,-2));FX.flash(p.x,p.y,1.2);rig.earL.vel-=16;rig.earR.vel-=14;rig.tailFlick(4);}
  if(once('clunk',t>=2.22)){rig.vy-=140;rig.hOy.vel-=60;for(const id of ['FN','HN']){const l=rig.leg(id);FX.dust(l.fx,GY,3,.5);}shake=Math.max(shake,2.2);}
  if(t>2.6){mode='play';modeT=0;caption('start');}
}
const flags=new Set();
function once(k,cond){if(cond&&!flags.has(k)){flags.add(k);return true;}return false;}

/* the toy: freeze, wiggle, pounce, pin it. Then it wriggles free and goes home. */
function pounceReady(){
  const pt=room.part;if(!pt||st.got||rig.air||rig.turnT>=0)return false;
  const d=pt.x-rig.x, f=Math.sign(d);
  if(f!==rig.facing||Math.abs(d)>190||Math.abs(d)<40)return false;
  return !BL.some(b=>f>0?(b.x0>rig.x&&b.x0<pt.x):(b.x1<rig.x&&b.x1>pt.x));
}
function pounce(dt,c,t){
  const pt=room.part, f=rig.facing, k=st.pk;
  c.limp=rig.hipGear<1?1:0;c.vx=0;c.accel=k.land?2500:900;c.earFlick=false;   // claws in on landing: it stops short
  if(t<1.95&&!k.flying&&!k.home){
    const hx=rig.toWorld({x:rig.hx,y:rig.hy}).x;
    Object.assign(c,{earL:-16,earR:-14,pupil:1,lid:0,lidTilt:-.1,headTilt:.3,mouth:.3,lookX:clamp((pt.x-hx)*f/120,-1,1),lookY:-.4});
  }
  if(once('perk',t>.05)){rig.earL.vel-=12;rig.earR.vel-=12;}
  if(t<.95){c.crouch=.5*seg(t,.1,.5);}
  if(t>=.5&&t<.95){
    Object.assign(c,{hipLift:7+Math.sin(t*24)*2.5,pitch:-.05,wagTip:18,tipFreq:4,gaitRate:0});
    k.wg=(k.wg??0)-dt;if(k.wg<0){k.wg=.11;rig.forceStep(k.wf?'HF':'HN',.1);k.wf=!k.wf;}
  }
  if(once('jump',t>=.95)){const tx=pt.x-f*64;rig.jump(430,f*clamp(Math.abs(tx-rig.x)/.36,60,340));}
  if(t>.95&&rig.air){c.tuck=.7;c.claws=1;c.tailBase=185;c.tailCurve=-4;}
  if(t>1.0&&!rig.air&&!k.land){k.land=t;FX.dust(pt.x,GY,4,.6);}
  if(k.land&&!k.flying&&!k.home){
    const lt=t-k.land;
    c.crouch=.22;c.happy=lt>.1?1:0;c.mouth=1.2;c.claws=lt<.3?1:0;c.tailBase=130;c.wagAmp=6;c.wagFreq=2.5;
    c.manual.FN={x:pt.x-f*2,y:22,ang:.25,rate:30};
    k.squash=Math.max(0,1-lt*4);
    if(lt>.6){k.flying=t;k.fx=pt.x;k.fy=GY-15;}
  }
  if(k.flying&&!k.home){
    // it goes back where it came from. catbot watches it go, over its shoulder.
    const u=clamp((t-k.flying)/.8,0,1), e=easeIO(u), hip=rig.toWorld(rig.hipJ);
    k.x=lerp(k.fx,hip.x,e);k.y=lerp(k.fy,hip.y,e)-Math.sin(Math.PI*u)*46;k.u=u;
    Object.assign(c,{headYaw:-.75,lookX:-1,lookY:-.2,headFwd:-6,headTilt:-.08,earL:42,earR:58,pupil:.9,lid:0,crouch:.1,mouth:0});
    if(Math.random()<dt*30)FX.sparks(k.x,k.y,1,-f,.25);
    if(u>=1){
      k.home=t;rig.hipGear=1;st.got=true;installed.add(pt.id);
      const hp=rig.toWorld(rig.hipJ);FX.flash(hp.x,hp.y,1.1,'255,225,150');FX.sparks(hp.x,hp.y,10,-f,.7);FX.sparks(hp.x,hp.y,6,f,.5);
      rig.vy-=90;rig.thv+=.9;rig.earL.vel-=18;rig.earR.vel-=16;rig.tailFlick(5);shake=Math.max(shake,2.6);
    }
  }
  if(k.home){
    const ht=t-k.home;
    // startled -> test the leg -> pleased with itself
    Object.assign(c,{headYaw:ht<.9?-.6:.35,lookX:ht<.9?-1:.4,lookY:0,pupil:ht<.5?.2:.5,lid:0,earL:-16,earR:-14,mouth:ht<.6?-.4:.6,headFwd:ht<.9?-4:0});
    for(const [i,tt] of [[0,.55],[1,.8],[2,1.05]])if(once('test'+i,ht>=tt))rig.forceStep('HN',.14);
    if(ht>1.3){Object.assign(c,{happy:1,tailBase:118,tailCurve:-4,tailTip:-12,wagAmp:6,wagFreq:3,keySpin:6});}
    if(once('puff',ht>=1.35)){const kp=rig.toWorld(rig.keyP);FX.steam(kp.x,kp.y-4,5,.9);}
    if(ht>2.1){mode='play';modeT=0;}
  }
}
/* the crate fell out from under its paws. it meant to do that. */
function oops(dt,c,dir,t){
  if(t>.7&&dir){st.oops=null;return false;}
  c.limp=rig.hipGear<1?1:0;c.vx=0;c.accel=500;
  Object.assign(c,{lid:.5,lidTilt:.55,lookX:-.6,lookY:.1,headYaw:.15,earL:24,earR:18,mouth:-.15,earFlick:false,blink:false});
  if(t>.95&&t<2.7){
    // groom: paw up to the muzzle, three licks, eyes shut
    const lt=t-.95, f=rig.facing;
    Object.assign(c,{lid:.95,headPitch:-.28+Math.sin(lt*10)*.07,headDrop:4,headTilt:.12,mouth:.2,earL:6,earR:4});
    c.manual.FN={x:rig.x+f*(rig.hx+3),y:rig.hy-19,ang:1.0,rate:9};c.pawFront=1;
  }
  if(t>2.9){st.oops=null;}
  return true;
}
function control(dt,c){
  if(latch&&!dirInput())latch=false;
  const dir=latch?0:dirInput();
  modeT+=dt;
  if(mode==='asleep'){
    slump(c,T);
    if(dir){mode='wake';modeT=0;latch=true;}
  }else if(mode==='wake'){
    wake(dt,c,modeT);
  }else if(mode==='pounce'){
    pounce(dt,c,modeT);
  }else if(mode==='play'){
    if(st.oops!=null&&oops(dt,c,dir,st.oops+=dt))return;
    walk(dt,c,dir);
    if(pounceReady()){mode='pounce';modeT=0;st.pk={};endPush();return;}
    // reset tile: front paws on it, facing it
    const rs=room.reset;
    if(rs&&rig.facing<0&&rig.x-45<rs.x+rs.w-14){mode='rewind';modeT=0;fadeTo(()=>{resetRoom();mode='play';});}
    // exit hatch
    const ex=room.exit;
    if(ex&&rig.x>ex.x+64){mode='exit';modeT=0;fadeTo(()=>{mode='card';modeT=0;});}
  }else if(mode==='rewind'){
    c.vx=0;c.keySpin=-14;c.lid=.4;c.limp=rig.hipGear<1?1:0;
  }else if(mode==='exit'){
    c.vx=105;c.face=1;
  }else if(mode==='card'){
    if(modeT>3.4&&fadeDir===0){fadeTo(()=>{installed.clear();seenCaps.clear();flags.clear();loadRoom(0);sleep();});}
  }
}

/* =====================================================================
   EVENTS -> particles
   ===================================================================== */
function handleRigEvents(){
  for(const e of rig.events){
    if(e.k==='land'){const p=clamp(e.mag/420,.4,1.6);FX.dust(e.x-30,e.y,6,p,-1);FX.dust(e.x+30,e.y,6,p,1);FX.ring(e.x,e.y,p);shake=Math.max(shake,Math.min(6,e.mag/110));}
    else if(e.k==='thud'){const p=clamp(e.mag/260,.3,1.3);FX.dust(e.x,e.y,9,p);FX.ring(e.x,e.y,p*.6);shake=Math.max(shake,Math.min(5,e.mag/70));}
    else if(e.k==='headthud'){FX.dust(e.x,e.y,6,.7);shake=Math.max(shake,Math.min(4,e.mag/70));}
    else if(e.k==='step'){FX.dust(e.x,e.y,2,.45);}
    else if(e.k==='scuff'){FX.dust(e.x,e.y,1,.3,-rig.facing);}
  }
  rig.events.length=0;
}

  if(mode!=='card')return;
  const a=Math.min(1,modeT/.5);
  g.fillStyle='#0b0d11';g.fillRect(0,0,W,H);
  g.globalAlpha=a;g.textAlign='center';
  g.font='600 13px Oswald,sans-serif';g.fillStyle='#d6a54e';g.fillText(`ROOM ${roomI+1}  ·  ${room.name.toUpperCase()}`,W/2,H/2-26);
  g.font='600 34px Oswald,sans-serif';g.fillStyle='#efe6d2';g.fillText(`${installed.size} PART${installed.size===1?'':'S'} BACK WHERE ${installed.size===1?'IT BELONGS':'THEY BELONG'}`,W/2,H/2+10);
  g.font='400 14px Inter,sans-serif';g.fillStyle='rgba(239,230,210,.6)';g.fillText('The rest of the shuttle is still dark.',W/2,H/2+40);
  g.textAlign='left';g.globalAlpha=1;
}

/* =====================================================================
   LOOP
   ===================================================================== */
function resize(){
  const vw=innerWidth,vh=innerHeight,w=Math.min(vw,vh*W/H),dpr=Math.min(2,devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=(w*H/W)+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);S=cv.width/W;
  for(const c of [catC,silC]){c.width=cv.width;c.height=cv.height;}
}
addEventListener('resize',resize);

let last=performance.now(), acc=0, T=0;
const SUB=1/240;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  tick(dt);render(dt);
  requestAnimationFrame(frame);
}
function tick(dt){
  T+=dt;
  if(caps[0]&&(caps[0].t+=dt)>caps[0].max)caps.shift();
  const c=freshCtrl();
  control(dt,c);
  BL=blockers();
  acc+=dt;let n=0;while(acc>=SUB&&n<40){rig.update(SUB,c);constrain();acc-=SUB;n++;}
  updCrate(dt);updGates(dt);
  handleRigEvents();updParts(dt);
  camX=damp(camX,camTarget(),4,dt);
  if(fadeDir){fade+=fadeDir*dt*2.4;if(fade>=1&&fadeDir>0){fade=1;fadeDir=-1;const cb=fadeCb;fadeCb=null;cb&&cb();camX=camTarget();}if(fade<=0&&fadeDir<0){fade=0;fadeDir=0;}}
}

function render(dt){
  const cw=cv.width,ch=cv.height;
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.setTransform(S,0,0,S,sx*S,sy*S);
  ctx.save();ctx.translate(-camX,0);
  drawRoom(ctx,T);
  drawScratches(ctx);
  ctx.restore();
  // cat -> offscreen, then its silhouette for the projected shadow
  cctx.setTransform(1,0,0,1,0,0);cctx.clearRect(0,0,cw,ch);cctx.setTransform(S,0,0,S,-camX*S,0);drawCat(cctx,rig);
  sctx.setTransform(1,0,0,1,0,0);sctx.globalCompositeOperation='source-over';sctx.clearRect(0,0,cw,ch);
  sctx.drawImage(catC,0,0);sctx.globalCompositeOperation='source-in';sctx.fillStyle='#0a0705';sctx.fillRect(0,0,cw,ch);sctx.globalCompositeOperation='source-over';
  ctx.save();ctx.transform(1,0,-SK,SS,SK*GY,(1-SS)*GY);
  if(FILTER)ctx.filter='blur(2px)';
  ctx.save();ctx.translate(-camX,0);ctx.fillStyle='rgba(8,5,3,.33)';
  const cr=st.crate;if(cr.cy<1)ctx.fillRect(cr.x,GY-cr.h+2,cr.w,cr.h);
  ctx.fillStyle='rgba(8,5,3,.3)';partShadow(ctx,T);ctx.restore();
  ctx.globalAlpha=.36;ctx.drawImage(silC,0,0,W,H);ctx.restore();
  ctx.save();ctx.translate(-camX,0);
  crateAO(ctx);partAO(ctx,T);
  contactAO(ctx,rig);
  drawCrateW(ctx);
  drawPart(ctx,T);
  ctx.restore();
  ctx.save();ctx.setTransform(1,0,0,1,sx*S,sy*S);ctx.drawImage(catC,0,0);ctx.restore();
  ctx.save();ctx.translate(-camX,0);
  drawGlow(ctx,rig);
  drawPartFly(ctx,T);
  drawGateFront(ctx);
  drawExitFront(ctx,T);
  drawParts(ctx);
  ctx.restore();
  ctx.setTransform(S,0,0,S,0,0);
  vignette(ctx);
  drawTitle(ctx);
  drawCaptions(ctx);
  drawCard(ctx);
  if(fade>0){ctx.fillStyle=`rgba(11,13,17,${fade})`;ctx.fillRect(0,0,W,H);}
}

/* =====================================================================
   INPUT: movement only
   ===================================================================== */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){keys.l=true;e.preventDefault();}
  else if(k==='arrowright'||k==='d'){keys.r=true;e.preventDefault();}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=false;else if(k==='arrowright'||k==='d')keys.r=false;});
addEventListener('blur',()=>{keys.l=keys.r=false;});
for(const [id,key] of [['padL','l'],['padR','r']]){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{keys[key]=true;b.classList.add('on');b.setPointerCapture(e.pointerId);e.preventDefault();});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[key]=false;b.classList.remove('on');});
}
const touchy=()=>document.body.classList.add('touch');
if(matchMedia('(pointer:coarse)').matches)touchy();
addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchy();},{capture:true});
addEventListener('contextmenu',e=>e.preventDefault());

resize();loadRoom(0);sleep();
requestAnimationFrame(frame);
</script>
