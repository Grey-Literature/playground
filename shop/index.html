<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Unlisted on purpose: not linked from the garden, and kept out of search engines. -->
<meta name="robots" content="noindex, nofollow">
<title>Shop Walkthrough</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026ee; --ink:#e8e6e1; --dim:#9aa0a8; --accent:#e8a33d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }

  /* Always-on HUD: which layout am I looking at, and what are the keys. */
  #hud { position:fixed; left:12px; top:12px; padding:6px 10px; border-radius:6px;
    background:var(--panel); pointer-events:none; font-size:13px; }
  #hud b { color:var(--accent); font-weight:600; }
  #keys { position:fixed; left:12px; bottom:12px; padding:6px 10px; border-radius:6px;
    background:var(--panel); pointer-events:none; color:var(--dim); font-size:12px; }
  #keys kbd { color:var(--ink); background:#2c3038; border-radius:3px; padding:0 5px; margin-right:2px; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:#ffffffaa; pointer-events:none; }

  /* Pause / start card. Pointer lock hides the mouse, so layout buttons live here. */
  #pause { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b0c0fcc; cursor:pointer; }
  #card { max-width:420px; width:calc(100% - 32px); padding:20px 22px; border-radius:10px;
    background:#1d2026; border:1px solid #2c3038; cursor:default; }
  #card p { margin:0 0 12px; color:var(--dim); }
  #card .go { display:block; width:100%; padding:11px; border:0; border-radius:6px; cursor:pointer;
    background:var(--accent); color:#1a1405; font-weight:600; font-size:15px; }
  #layouts { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
  #layouts button { padding:6px 10px; border-radius:5px; border:1px solid #3a3f48; cursor:pointer;
    background:#262a31; color:var(--ink); font-size:13px; }
  #layouts button.on { border-color:var(--accent); color:var(--accent); }
  #card small { display:block; margin-top:12px; color:var(--dim); font-size:12px; }
  #err { color:#ff8a7a; margin-top:10px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="hud"><b id="hudName">…</b> <span id="hudHint"></span></div>
<div id="keys">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;
  <kbd>Shift</kbd> sprint &nbsp; <kbd>1</kbd>–<kbd>9</kbd> layout &nbsp;
  <kbd>B</kbd> before/after &nbsp; <kbd>T</kbd> top-down &nbsp; <kbd>L</kbd> labels &nbsp; <kbd>Esc</kbd> menu
</div>
<div id="cross"></div>

<div id="pause">
  <div id="card">
    <p>Click the button, then use the mouse to look and <b style="white-space:nowrap">W A S D</b> to walk.
       Press <b>B</b> any time to flip between before and after.</p>
    <div id="layouts"></div>
    <button class="go" id="go">Walk the shop</button>
    <small>Esc brings this menu back. Hold Shift to move faster.</small>
    <div id="err"></div>
  </div>
</div>

<!-- Three.js comes from a free CDN so the repo needs no build step. Pinned version: a
     CDN "latest" changing under us the night before a demo is the failure to avoid. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="./layouts.js"></script>
<script type="module" src="./viewer.js"></script>
<!-- If the CDN is unreachable the module never runs and the page would just sit there.
     Say so in the menu card instead (the recorded walkthrough video is the fallback). -->
<script>
  setTimeout(function () {
    if (!window.__shopReady) {
      document.getElementById('err').textContent =
        "The 3D viewer didn't load. It needs internet access to fetch Three.js. Check the connection or use the recorded video.";
    }
  }, 6000);
</script>
</body>
</html>
